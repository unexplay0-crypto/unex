
name: Gerar APK e AAB Android

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true

      - name: Verificar arquivos do projeto
        run: |
          test -f pubspec.yaml || {
            echo "::error::pubspec.yaml não encontrado na raiz."
            exit 1
          }

          test -f native/MainActivity.kt || {
            echo "::error::native/MainActivity.kt não encontrado."
            exit 1
          }

          test -f native/AndroidManifest.xml || {
            echo "::error::native/AndroidManifest.xml não encontrado."
            exit 1
          }

          echo "----- Versões -----"
          flutter --version
          java -version

      - name: Verificar dependências Flutter
        run: |
          flutter pub get
          flutter pub deps

      - name: Validar código Dart
        run: |
          dart analyze lib

      - name: Restaurar keystore de assinatura (opcional)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            test -s ~/.android/debug.keystore
            echo "Keystore restaurada."
          else
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 ausente."
          fi

      - name: Recriar estrutura Flutter Android
        run: |
          rm -rf android
          flutter create \
            --org com.exemplo \
            --project-name iptv_player \
            --platforms=android \
            .

      - name: Instalar código nativo
        run: |
          DEST="android/app/src/main/kotlin/com/exemplo/iptv_player"
          mkdir -p "$DEST"
          find android/app/src/main -name 'MainActivity.*' -delete
          cp native/MainActivity.kt "$DEST/MainActivity.kt"

      - name: Aplicar AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          cp native/AndroidManifest.xml "$MANIFEST"

          grep -q 'android.permission.INTERNET' "$MANIFEST" || {
            echo "::error::Manifest sem permissão INTERNET."
            exit 1
          }

          grep -q 'usesCleartextTraffic="true"' "$MANIFEST" || {
            echo "::error::Manifest sem usesCleartextTraffic=true."
            exit 1
          }

          grep -q 'LEANBACK_LAUNCHER' "$MANIFEST" || {
            echo "::error::Manifest sem launcher Android TV."
            exit 1
          }

          grep -q 'flutterEmbedding' "$MANIFEST" || {
            echo "::error::Manifest sem flutterEmbedding."
            exit 1
          }

          cat "$MANIFEST"

      - name: Resolver dependências após criar Android
        run: |
          flutter pub get

      - name: Compilar APK Release
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --tree-shake-icons \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --build-number=${{ github.run_number }} \
            --dart-define=UPDATE_URL=https://github.com/${{ github.repository }}/releases/latest/download/version.json

      - name: Compilar AAB Release
        run: |
          flutter build appbundle --release \
            --target-platform android-arm,android-arm64 \
            --tree-shake-icons \
            --obfuscate \
            --split-debug-info=build/debug-info-aab \
            --build-number=${{ github.run_number }} \
            --dart-define=UPDATE_URL=https://github.com/${{ github.repository }}/releases/latest/download/version.json

      - name: Gerar version.json
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')

          cp build/app/outputs/flutter-apk/app-release.apk app-release.apk
          cp build/app/outputs/bundle/release/app-release.aab app-release.aab

          jq -n \
            --argjson code "${{ github.run_number }}" \
            --arg name "$VERSION_NAME" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/app-release.apk" \
            --arg notes "${COMMIT_MSG:-Melhorias e correções.}" \
            '{versionCode:$code, versionName:$name, apkUrl:$url, notes:$notes, force:false}' \
            > version.json

          cat version.json

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: UNEX Vision ${{ github.run_number }}
          make_latest: true
          files: |
            app-release.apk
            app-release.aab
            version.json

      - name: Disponibilizar APK e AAB para download
        uses: actions/upload-artifact@v4
        with:
          name: unex-vision-apk-aab
          path: |
            app-release.apk
            app-release.aab
            version.json
