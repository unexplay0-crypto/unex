name: Gerar APK e AAB Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # necessario para publicar a Release com APK + AAB + version.json

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      # Assinatura estável: sem isso cada build usa uma chave debug nova e o
      # Android recusa instalar a atualização por cima do app antigo (OTA).
      # Crie o secret DEBUG_KEYSTORE_BASE64 (veja o README). A MESMA keystore
      # assina o AAB enviado à Google Play.
      - name: Restaurar keystore de assinatura (opcional, recomendado)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Keystore restaurada."
          else
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 ausente: a atualização OTA só instala se desinstalar o app antigo antes."
          fi

      - name: Recriar estrutura Flutter Android
        run: |
          rm -rf android
          flutter create --org com.exemplo --project-name iptv_player --platforms=android .
          flutter pub get

      - name: Instalar código nativo (brilho, volume, detecção de TV)
        run: |
          DEST="android/app/src/main/kotlin/com/exemplo/iptv_player"
          mkdir -p "$DEST"
          find android/app/src/main -name 'MainActivity.*' -delete
          cp native/MainActivity.kt "$DEST/MainActivity.kt"

      # O manifesto é COPIADO já pronto em vez de remendado com sed: garante
      # INTERNET + usesCleartextTraffic (os servidores de IPTV usam http://, e o
      # ExoPlayer respeita essa permissão, ao contrário do cliente Dart) e o
      # launcher de Android TV, sem depender do template do flutter create.
      - name: Aplicar AndroidManifest (permissões, http e launcher de TV)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          cp native/AndroidManifest.xml "$MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST" || { echo "::error::manifest sem INTERNET"; exit 1; }
          grep -q 'usesCleartextTraffic="true"' "$MANIFEST" || { echo "::error::manifest sem usesCleartextTraffic"; exit 1; }
          grep -q 'LEANBACK_LAUNCHER' "$MANIFEST" || { echo "::error::manifest sem launcher de TV"; exit 1; }
          grep -q 'flutterEmbedding' "$MANIFEST" || { echo "::error::manifest sem flutterEmbedding"; exit 1; }
          echo "----- Manifest final -----"
          cat "$MANIFEST"

      - name: Compilar APK Otimizado (Release Leve)
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --tree-shake-icons \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --build-number=${{ github.run_number }} \
            --dart-define=UPDATE_URL=https://github.com/${{ github.repository }}/releases/latest/download/version.json

      - name: Compilar AAB (Google Play)
        run: |
          flutter build appbundle --release \
            --target-platform android-arm,android-arm64 \
            --tree-shake-icons \
            --obfuscate \
            --split-debug-info=build/debug-info-aab \
            --build-number=${{ github.run_number }} \
            --dart-define=UPDATE_URL=https://github.com/${{ github.repository }}/releases/latest/download/version.json

      - name: Gerar version.json (usado pela checagem de atualização)
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk app-release.apk
          cp build/app/outputs/bundle/release/app-release.aab app-release.aab
          jq -n \
            --argjson code ${{ github.run_number }} \
            --arg name "$VERSION_NAME" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/app-release.apk" \
            --arg notes "${COMMIT_MSG:-Melhorias e correções.}" \
            '{versionCode:$code, versionName:$name, apkUrl:$url, notes:$notes, force:false}' > version.json
          cat version.json

      - name: Publicar Release (APK + AAB + version.json)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: UNEX Vision ${{ github.run_number }}
          make_latest: true
          files: |
            app-release.apk
            app-release.aab
            version.json

      - name: Disponibilizar APK e AAB para Download
        uses: actions/upload-artifact@v4
        with:
          name: unex-vision-apk-aab
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
